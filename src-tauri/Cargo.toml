[package]
name = "tiny-calendar"
version = "0.1.0"
edition = "2021"

[profile.dev]
debug = 1          # 只保留行号信息，大幅缩小 debug 二进制
strip = "none"     # debug 构建保留符号方便调试
incremental = true # 增量编译（加速 rebuild，但会多占磁盘）

[profile.release]
debug = false      # 不含调试信息
strip = true       # 剥离符号表，显著减小体积
opt-level = "s"    # 优化体积优先
lto = true         # 链接时优化
codegen-units = 1  # 单代码生成单元，更小但编译更慢

# dev 模式下用 release profile 时的折中配置：
# pnpm tauri dev 默认会用这个（因为 devCargoArgs = ["--release"]）
# 编译速度比纯 release 快，体积比 debug 小很多
[profile.dev-release]
inherits = "release"
debug = 1          # 保留行号（方便 dev 调试）
strip = false      # 保留符号（方便 dev 调试）
lto = false        # 不用链接时优化（加速迭代）
codegen-units = 4  # 并行编译（加速迭代）
opt-level = 2      # 正常优化级别

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
